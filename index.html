<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Frontend</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>DevOps Projesi v2</h1>
      <p class="subtitle">Frontend &rarr; Backend bağlantı testi</p>
    </header>

    <main class="card">
      <section class="section">
        <h2>Backend Durumu</h2>
        <p class="hint">Aşağıdaki butona basarak backend API'sine istek atabilirsin.</p>
        <button id="checkBtn" class="btn">Backend'i Kontrol Et</button>

        <div id="result" class="result result--idle">
          <span class="result__label">Henüz istek atılmadı.</span>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="versionInfo">Versiyon bilgisi yükleniyor...</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
